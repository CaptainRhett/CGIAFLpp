# Check that rftaskd process is running
check process rftaskd with pidfile /tmp/redfish/rftaskd.pid
    start program = "/etc/monit/scripts/rftaskd-init start" as uid "httpd" and gid "httpd"
    stop program = "/etc/monit/scripts/rftaskd-init stop"
###
# Check log file to ensure it does not grow too large.
check file rftaskd-log with path /var/log/rftaskd.log
    if not exist then unmonitor
    if size > 100 KB then exec "/usr/bin/rotate-log.sh -n 2 /var/log/rftaskd.log"
