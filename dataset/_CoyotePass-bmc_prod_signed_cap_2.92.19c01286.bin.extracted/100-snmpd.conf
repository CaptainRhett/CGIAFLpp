# Check that snmpd process is running and listening on configured port
check process snmpd with pidfile /var/run/snmpd.pid
    start program = "/etc/monit/scripts/snmpd-init start"
    stop program = "/etc/monit/scripts/snmpd-init stop"
    if failed host localhost port __SNMP_PORT__ type UDP for 4 cycles
        then restart
#    if failed host ip6-localhost port 161 type UDP then restart
#    if failed host ip6-localhost port 199 type TCP then restart
###
# Check log file to ensure it does not grow too large.
check file snmpd-log with path /var/log/snmpd.log
    if not exist for 4 cycles then unmonitor
    if size > 100 KB then exec "/usr/bin/rotate-log.sh -n 2 /var/log/snmpd.log"
