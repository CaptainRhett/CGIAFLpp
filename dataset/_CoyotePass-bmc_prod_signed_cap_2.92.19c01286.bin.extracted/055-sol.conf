# Check that SOL(dropbear) process is running and listening on configured port
check process sol with pidfile /var/run/sol.pid
    start program = "/etc/monit/scripts/sol-init start"
    stop program = "/etc/monit/scripts/sol-init stop"
    if failed host ip6-localhost port __SOL_PORT__ type TCP protocol ssh for 4 cycles
        then restart
###
# Check log file to ensure it does not grow too large.
check file sol-log with path /var/log/sol.log
    if not exist for 4 cycles then unmonitor
    if size > 100 KB then exec "/usr/bin/rotate-log.sh -n 2 /var/log/sol.log"
