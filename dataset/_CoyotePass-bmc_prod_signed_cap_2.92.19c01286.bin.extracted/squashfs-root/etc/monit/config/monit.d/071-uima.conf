# Check that uima process is running
check process uima with pidfile /var/run/uima.pid
    start program = "/etc/monit/scripts/uima-init start"
    stop program = "/etc/monit/scripts/uima-init stop"
###
# Check log file to ensure it does not grow too large.
check file uima-log with path /var/log/uima.log
    if not exist for 4 cycles then unmonitor
    if size > 100 KB then exec "/usr/bin/rotate-log.sh -n 2 /var/log/uima.log"
