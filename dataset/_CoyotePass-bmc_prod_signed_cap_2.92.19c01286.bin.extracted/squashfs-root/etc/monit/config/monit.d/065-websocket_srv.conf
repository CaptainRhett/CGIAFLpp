# Check that ikvmserver process is running and listening on configured port
check process websocket_srv with pidfile /var/run/websocket_srv.pid
    start program = "/etc/monit/scripts/websocket-init start"
    stop program = "/etc/monit/scripts/websocket-init stop"
###
# Check log file to ensure it does not grow too large.
check file websocket_srv-log with path /var/log/websocket_srv.log
    if not exist then unmonitor
    if size > 100 KB then exec "/usr/bin/rotate-log.sh -n 2 /var/log/websocket_srv.log"
