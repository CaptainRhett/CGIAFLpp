# Check that usb process is running and listening on configured port
check process usb with pidfile /var/run/usb.pid
    start program = "/etc/monit/scripts/usb-init start"
    stop program = "/etc/monit/scripts/usb-init stop"
    if failed host __HOSTNAME__ port __USB_PORT__ type TCP for 4 cycles
        then restart
###
# Check log file to ensure it does not grow too large.
check file usb-log with path /var/log/usb.log
    if not exist for 4 cycles then unmonitor
    if size > 100 KB then exec "/usr/bin/rotate-log.sh -n 2 /var/log/usb.log"
