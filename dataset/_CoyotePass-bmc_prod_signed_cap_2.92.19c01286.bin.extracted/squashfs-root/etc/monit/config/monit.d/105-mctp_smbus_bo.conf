# Check that mctp processes are running
#check process mctp_smbus_bo with pidfile /var/run/mctp_smbus_bo.pid
check process mctp_smbus_bo matching "/usr/bin/mctp_smbus_bo"
    start program = "/etc/monit/scripts/mctp_smbus_bo-init start"
    stop program = "/etc/monit/scripts/mctp_smbus_bo-init stop"
    depends on smbus_tb_handler
