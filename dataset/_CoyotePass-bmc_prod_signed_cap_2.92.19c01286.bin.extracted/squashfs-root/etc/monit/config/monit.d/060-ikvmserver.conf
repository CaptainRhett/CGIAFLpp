# Check that ikvmserver process is running and listening on configured port
check process ikvmserver with pidfile /var/run/ikvmserver.pid
    start program = "/etc/monit/scripts/ikvm-init start"
    stop program = "/etc/monit/scripts/ikvm-init stop"
    if failed host ip6-localhost port __KVM_PORT__ type TCP for 4 cycles
        then restart
###
# Check log file to ensure it does not grow too large.
check file ikvm-log with path /var/log/ikvmserver.log
    if not exist for 4 cycles then unmonitor
    if size > 100 KB then exec "/usr/bin/rotate-log.sh -n 2 /var/log/ikvmserver.log"
