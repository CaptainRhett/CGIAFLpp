# Check that upnp_dev process is running
check process upnp_dev with pidfile /var/run/upnp_dev.pid
    depends on httpd
    start program = "/etc/monit/scripts/upnpd-init start"
    stop program = "/etc/monit/scripts/upnpd-init stop"
    if failed host localhost port 1900 type UDP for 4 cycles
        then restart
