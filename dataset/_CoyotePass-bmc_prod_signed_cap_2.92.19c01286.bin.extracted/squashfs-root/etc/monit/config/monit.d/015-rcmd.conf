# Check that rcmd process is running
check process rcmd with pidfile /var/run/rcmd.pid
    start program = "/etc/monit/scripts/rcmd-init start"
    stop program = "/etc/monit/scripts/rcmd-init stop"

# Check rcmd log file to ensure it does not grow too large.
check file rmcmd-log with path /var/log/rcmd.log
    if size > 100 KB then exec /etc/monit/scripts/rotate-rcmd-log
