# Check that mctp processes are running
#check process smbus_tb_handler with pidfile /var/run/smbus_tb_handler.pid
check process pldmd matching "/usr/bin/pldmd"
    start program = "/etc/monit/scripts/pldmd-init start"
    stop program = "/etc/monit/scripts/pldmd-init stop"
    depends on mctp_pcie_bo