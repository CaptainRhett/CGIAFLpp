# Check that mctp processes are running
#check process smbus_tb_handler with pidfile /var/run/smbus_tb_handler.pid
check process smbus_tb_handler matching "/usr/bin/smbus_tb_handler"
    start program = "/etc/monit/scripts/smbus_tb_handler-init start"
    stop program = "/etc/monit/scripts/smbus_tb_handler-init stop"
    depends on protocol_handler
