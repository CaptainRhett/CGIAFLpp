# Check that lighttpd process is running and listening on configured port
check process httpd with pidfile /var/run/lighttpd.pid
    start program = "/etc/monit/scripts/httpd-init start"
    stop program = "/etc/monit/scripts/httpd-init stop"
    if failed host ip6-localhost port __HTTPS_PORT__ type tcpssl protocol http status < 401
        with timeout 15 seconds for 4 cycles
        then restart
