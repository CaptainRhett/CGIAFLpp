## Check that ipmid process is running and that it is listening on port 623.
## If the process is not running, Monit will restart it.
## it by default. In case the service is restarted very often and the
## problem remains, it is possible to disable monitoring using the TIMEOUT
## statement. This service depends on another service (apache_bin) which
## is defined above.
#
check process ipmid with pidfile /var/run/ipmid.pid
    start program = "/etc/monit/scripts/ipmid-init start"
    stop program = "/etc/monit/scripts/ipmid-init stop"
    if failed host ip6-localhost port 623 type UDP for 4 cycles
        then restart
    __IF_IPMID_RESTART_COND__ then exec "/etc/monit/scripts/watchdog-reboot"
    if uptime < 15 minutes
        then exec "/etc/monit/scripts/check-stable.sh"
    else if succeeded
        then exec "/usr/bin/boot_progress.sh MB_RUNTM_STABLE_APP_15"

# The following performs an RMCP ping to ipmid. However, although ipmid listens
# on all ports, it only works if ipmid is modified to add a channel for localhost
#        port 623 use type udp and
#        send "\0x06\0x00\0x69\0x06\0x00\0x00\0x11\0xbe\0x80\0x69\0x00\0x00"
#        expect "\0x06[\\]0\0xff\0x06[\\]0[[\\]0\0x11\0xbe\0x40\0x69[\\]0.*"
#        then exec "/tmp/logit"
#

###
# This monitors health of ipmid by sending select ipmi commands with cmdtool.
# If it fails, stop ipmid which will in turn get restarted by the process check
check program ipmid-ck with path "/etc/monit/scripts/ipmid-ck.sh"
    with timeout 25 seconds
    every 2 cycles
    if status != 0 for 4 cycles then exec "/etc/monit/scripts/ipmid-init stop"

###
# Check ipmid log file to ensure it does not grow too large.
check file ipmid.log with path /tmp/var/log/ipmid.log
    if size > 200 KB then exec /etc/monit/scripts/rotate-ipmid-log
        repeat every 1 cycles

###
# Check console message log file to ensure it does not grow too large.
check file messages with path /tmp/var/log/messages
    if size > 4096 KB then exec /etc/monit/scripts/rotate-message-log
        repeat every 1 cycles
