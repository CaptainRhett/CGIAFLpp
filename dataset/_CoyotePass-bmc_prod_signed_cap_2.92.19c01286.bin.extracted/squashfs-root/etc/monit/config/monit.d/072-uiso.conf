# Check that uiso process is running
check process uiso with pidfile /var/run/uiso.pid
    start program = "/etc/monit/scripts/uiso-init start"
    stop program = "/etc/monit/scripts/uiso-init stop"
###
# Check log file to ensure it does not grow too large.
check file uiso-log with path /var/log/uiso.log
    if not exist for 4 cycles then unmonitor
    if size > 100 KB then exec "/usr/bin/rotate-log.sh -n 2 /var/log/uiso.log"
