# Check that biosoob process is running
check process biosoob with pidfile /var/run/biosoob.pid
    start program = "/etc/monit/scripts/biosoob-init start"
    stop program = "/etc/monit/scripts/biosoob-init stop"

###
# Check BIOS OOB XML check script to make sure it exists.
check file bios-check with path /etc/monit/scripts/biosoob-ck.sh
    if not exist then exec "/etc/monit/scripts/biosoob-init stop"

###
# Check BIOS OOB XML file to make sure it exists.
check file bios.xml with path /tmp/bios.xml
    if not exist then exec "/etc/monit/scripts/biosoob-ck.sh"
    repeat every 4 cycles