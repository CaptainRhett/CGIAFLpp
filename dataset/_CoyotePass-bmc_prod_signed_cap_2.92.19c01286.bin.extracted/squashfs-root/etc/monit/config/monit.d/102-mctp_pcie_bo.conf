# Check that mctp processes are running
#check process mctp_pcie_bo with pidfile /var/run/mctp_pcie_bo.pid
check process mctp_pcie_bo matching "/usr/bin/mctp_pcie_bo"
    start program = "/etc/monit/scripts/mctp_pcie_bo-init start"
    stop program = "/etc/monit/scripts/mctp_pcie_bo-init stop"
    depends on pcie_vdm_handler
