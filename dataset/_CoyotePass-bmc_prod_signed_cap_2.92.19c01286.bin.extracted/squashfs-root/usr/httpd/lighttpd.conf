#### auth module
## read authentication.txt for more info


# Custom backend that prevents access to content without a valid session cookie
auth.backend               = "bmcsess"
auth.backend.bmcsess.cookie = "__Host-SID"
auth.backend.bmcsess.fsprefix = "/tmp/sess_"

# /cgi/login.cgi and /preauth are the only resources available pre-auth
$HTTP["url"] =~ "^/cgi|^/js|^/css|^/help|^/images|^/legal|^/novnc|^/page|^/res|^/yui|^/internalVM" {
  $HTTP["url"] !~ "^/cgi/login.cgi|^/cgi/url_redirect.cgi|^/cgi/BmcServiceDesc.cgi" {
    auth.require               = ( "" =>
                               (
                                 "method"  => "cookie",
                                 "realm"   => "static content",
                                 "require" => "valid-user"
                               )
                             )
  }
}


#### url handling modules (rewrite, redirect, access)
#url.rewrite                = ( "^/$"             => "/server-status" )
# url.rewrite                = ( "^(.*)\.html\??(.*)?$" => "$1.www?$2" )
#url.redirect               = ( "^/wishlist/(.+)" => "http://www.123.org/$1" )
#### both rewrite/redirect support back reference to regex conditional using %n
#$HTTP["host"] =~ "^www\.(.*)" {
#  url.redirect            = ( "^/(.*)" => "http://%1/$1" )
#}

$HTTP["scheme"] == "http" {
    # capture vhost name with regex conditiona -> %0 in redirect pattern
    # must be the most inner block to the redirect rule
    $HTTP["url"] !~ ".*/cgi/BmcServiceDesc.cgi" {
        $HTTP["host"] =~ ".*" {
            url.redirect = (".*" => "https://%0$0")
        }
    }
}

# Enable HSTS since http is not allowed.
$HTTP["scheme"] == "https" {
    var.common-response-headers = (
        "X-Content-Type-Options" => "nosniff",
        "Strict-Transport-Security" => "max-age=31536000; includeSubdomains; preload",
        "X-UA-Compatible" => "IE=11",
        "X-Frame-Options" => "SAMEORIGIN",
        "X-XSS-Protection" => "1; mode=block"
    )

    var.preauth-csp = (
        "Content-Security-Policy" => "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"
    )
    var.default-csp = (
        "Content-Security-Policy" => "default-src 'none'; script-src 'self'; style-src 'self'; frame-src 'self'; font-src 'self'; connect-src 'self'; img-src 'self'"
    )
    var.launch-csp = (
        "Content-Security-Policy" => "default-src 'self'; script-src 'self'; style-src 'self'; frame-src 'self'; font-src 'self'; connect-src 'self' wss://*/websocket_srv wss://*/vm_websocket_srv; img-src 'self' data:"
    )

    var.nocache-response-headers = (
        "Cache-Control" => "no-store, no-cache",
        "Pragma" => "no-cache"
    )

    # Don't prevent caching in Java - required for KVM
    $HTTP["url"] !~ ".*/lib.*\.jar" {
        $HTTP["url"] =~ "^$|^/$|^/preauth" {
            setenv.add-response-header  = var.common-response-headers
            setenv.add-response-header  += var.nocache-response-headers
            setenv.add-response-header  += var.preauth-csp
        }
        else $HTTP["url"] =~ "/cgi/url_redirect.cgi.*" {
            $HTTP["querystring"] =~ "url_name=man_ikvm_html5_auto|url_name=vm_html5|url_name=man_vm_html5" {
                setenv.add-response-header  = var.common-response-headers
                setenv.add-response-header  += var.nocache-response-headers
                setenv.add-response-header  += var.launch-csp
            }
            else {
                setenv.add-response-header  = var.common-response-headers
                setenv.add-response-header  += var.nocache-response-headers
                setenv.add-response-header  += var.default-csp
            }
        }
        else $HTTP["url"] =~ "/vm_websocket_srv|/websocket_srv" {
            setenv.add-response-header  = var.common-response-headers
            setenv.add-response-header  += var.nocache-response-headers
            setenv.add-response-header  += var.launch-csp
        }
        else {
            setenv.add-response-header  = var.common-response-headers
            setenv.add-response-header  += var.nocache-response-headers
            setenv.add-response-header  += var.default-csp
        }
    }

    $HTTP["url"] =~ ".*/lib.*\.jar" {
        url.redirect = ("^/lib(.*)\.jar\?version-id=([^&]*)(.*)$" => "/lib$1__V$2.jar.pack.gz")
    }
    $HTTP["url"] =~ "/iKVM\.jar" {
            url.redirect = ("^/iKVM\.jar\?version-id=([^&]*)(.*)$" => "/iKVM__V$1.jar.pack.gz")
    }

    $HTTP["url"] !~ "/redfish/.*" {
        $HTTP["remoteip"] !~ "127.0.0.1|::1" {
            url.rewrite-once = (
# Lighttpd prevents access to directories by returning a 403 forbidden status.
# This reveals clues about the existence of the directory and may give clues to
# a potential attacker. The following rule will cause a 404 error instead.
               "^/.+/$" => "/404.html",
#
# To restrict web access to only redfish services, uncomment this:
#ONLY_ALLOW_REDFISH#               ".*" => "/404.html",

            )
        }
    }
}

$HTTP["url"] =~ "^/websocket_srv" {
    wstunnel.frame-type = "binary"
    wstunnel.server = (
        "" => ((
            "host" => "127.0.0.1",
            "port" => "9090",
        ))
    )
}

$HTTP["url"] =~ "^/vm_websocket_srv" {
    wstunnel.frame-type = "binary"
    wstunnel.server = (
        "" => ((
            "host" => "127.0.0.1",
            "port" => "5621",
        ))
    )
}

