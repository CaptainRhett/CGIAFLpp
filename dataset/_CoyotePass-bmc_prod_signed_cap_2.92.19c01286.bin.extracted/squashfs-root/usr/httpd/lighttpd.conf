# lighttpd configuration file
#
# use it as a base for lighttpd 1.0.0 and above
#
# $Id: lighttpd.conf,v 1.3 2012-11-07 08:37:20 randy Exp $
#
# Use this to determine if the copy in /nv needs to be updated from the base
# version.  To force the init script to re-copy the base version to /nv, update
# this guid here and in the httpd-init script.
# BASE_CFG_VERSION=27c18286-d16e-482c-a148-72f9da7ae1ba

############ Options you really have to take care of ####################

## modules to load
# at least mod_access and mod_accesslog should be loaded
# all other module should only be loaded if really neccesary
# - saves some time
# - saves memory
server.modules              = (
                               "mod_rewrite",
                               "mod_redirect",
                               "mod_alias",
                               "mod_access",
                               "mod_openssl",
#                               "mod_trigger_b4_dl",
                               "mod_auth",
                               "mod_authn_bmcsess",
#                               "mod_status",
                               "mod_setenv",
#                               "mod_fastcgi",
#                               "mod_proxy",
#                               "mod_simple_vhost",
#                               "mod_evhost",
#                               "mod_userdir",
                                "mod_cgi",
#                               "mod_compress",
#                               "mod_ssi",
#                               "mod_usertrack",
#                               "mod_expire",
#                               "mod_secdownload",
#                               "mod_rrdtool",
                                "mod_wstunnel",
                               "mod_accesslog"
                               )

## A static document-root. For virtual hosting take a look at the
## mod_simple_vhost module.
server.document-root        = "/web/"

#file upload setting (20MB + 1kB == 1kB headers + 20MB file)
server.max-request-size = 0
server.network-backend="write"
server.upload-dirs=("/tmp")

## where to send error-messages to
server.errorlog             = "/tmp/httpd/lighttpd_error.log"
server.breakagelog          = "/tmp/httpd/cgi_stderr.log"

# Maximum number of seconds until a waiting write call times out
# and closes the connection, default = 360
server.max-write-idle = 120
# websocket.timeout should be replaced with server.max-read-idle
#server.max-read-idle = 60
#websocket.ping_interval replaced with wstunnel.ping-interval (note the '_' changed to '-')
wstunnel.ping-interval = 45

#config options to stream request allows admin to configure if request is collected in entirety prior to sending data to backend
server.stream-request-body = 1
server.stream-response-body = 1

# files to check for if .../ is requested
index-file.names            = ("cgi/url_redirect.cgi")

## set the event-handler (read the performance section in the manual)
# server.event-handler = "freebsd-kqueue" # needed on OS X

