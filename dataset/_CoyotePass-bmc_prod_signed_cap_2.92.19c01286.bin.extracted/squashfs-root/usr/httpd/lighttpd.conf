## deny access the file-extensions
#
# ~    is for backupfiles from vi, emacs, joe, ...
# .inc is often used for code includes which should in general not be part
#      of the document-root
#url.access-deny             = ( "~", ".inc" )

#$HTTP["url"] =~ "\.pdf$" {
#  server.range-requests = "disable"
#}

##
# which extensions should not be handle via static-file transfer
#
# .php, .pl, .fcgi are most often handled by mod_fastcgi or mod_cgi
static-file.exclude-extensions = ( ".php", ".pl", ".fcgi", ".cgi")

######### Options that are good to be but not neccesary to be changed #######

## listen to HTTP ipv4 port
server.bind = "0.0.0.0"
server.port = 80

## listen to HTTP ipv6 port
#$SERVER["socket"] == "[::]:80" { }

##### SSL engine
## listen to HTTPS ipv4 port
$SERVER["socket"] == ":443" {
#server.use-ipv6 = "enable"
ssl.engine = "enable"
ssl.pemfile = "/nv/server.pem"
#ssl.ca-file = "/nv/CA/root/cacert.pem"
ssl.ca-file = "/nv/client_certificate/ca.crt"
ssl.ca-crl-file = "/nv/client_certificate/CA/crl/ca.crl"
ssl.use-sslv2 = "disable"
ssl.use-sslv3 = "disable"
ssl.cipher-list = "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256"
ssl.dh-file = "/usr/httpd/dh2048.pem"
ssl.ec-curve = "secp384r1"
ssl.verifyclient.activate = "enable"
ssl.verifyclient.enforce = "disable"
ssl.verifyclient.username = "SSL_CLIENT_S_DN_UID"
ssl.honor-cipher-order = "enable"
}

## listen to HTTPS ipv6 port
$SERVER["socket"] == "[::]:443" {
#server.use-ipv6 = "enable"
ssl.engine = "enable"
ssl.pemfile = "/nv/server.pem"
#ssl.ca-file = "/nv/CA/root/cacert.pem"
ssl.ca-file = "/nv/client_certificate/ca.crt"
ssl.ca-crl-file = "/nv/client_certificate/CA/crl/ca.crl"
ssl.use-sslv2 = "disable"
ssl.use-sslv3 = "disable"
ssl.cipher-list = "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256"
ssl.dh-file = "/usr/httpd/dh2048.pem"
ssl.ec-curve = "secp384r1"
ssl.verifyclient.activate = "enable"
ssl.verifyclient.enforce = "disable"
ssl.verifyclient.username = "SSL_CLIENT_S_DN_UID"
ssl.honor-cipher-order = "enable"
}

