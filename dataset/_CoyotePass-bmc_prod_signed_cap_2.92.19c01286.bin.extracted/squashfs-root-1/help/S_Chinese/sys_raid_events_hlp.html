<html>
    <head>
        <title>事件日志 - 帮助</title>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <link href='../../css/help/help_styles.css' rel='stylesheet' type='text/css'/>
        <script type="text/javascript" src="../../js/flot/jquery.min.js"></script>
        <script type="text/javascript" src="../../js/iframe_event.js"></script>
        <script type="text/javascript" src="../../js/help.js"></script>
    </head>
    <body>
        <div class='closeX'><a id="closeHelp" href='#' class='closeBtn'>关闭</a></div>

        <div class="helpmainhead">事件日志 - 帮助</div>
        <p id="desc">该页面使用页面导航来显示事件日志消息。</p>
        <h2 id="eventslog">事件日志</h2>
            <p id="eventslog_desc">事件日志由以下4个资料组成。</p>
        <ul>
            <p id="events_seqno"><b>序号</b>: 事件日志序列号。</p>
            <p id="events_level"><b>级别</b>: 事件日志的类型，信息，错误...等。</p>
            <p id="events_eventid"><b>事件编号</b>: 事件日志的事件编号。</p>
            <p id="events_time"><b>时间</b>: 事件日志生成的时间。</p>
            <p id="events_desc"><b>描述</b>: 事件日志的详细说明。</p>
        </ul>
        <div class="helpactionhead">操作</div>
        <div id="ctrlselect" class="actionsub">控制器选择</div>
        <p id="ctrlselect_desc">选择控制器选择器以显示不同RAID控制器的事件日志。</p>
        <div id="page" class="actionsub">页面导航</div>
        <p id="page_down">按下按钮 > 以查看日志消息的下一页。</p>
        <p id="page_up">按下按钮 < 以查看日志消息的上一页。</p>
    </body>
</html>
