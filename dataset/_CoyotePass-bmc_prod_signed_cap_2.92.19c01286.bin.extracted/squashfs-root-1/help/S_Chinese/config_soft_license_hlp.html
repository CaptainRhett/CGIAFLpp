        <h2>前次上传时间</h2>
          <p>显示软件许可证的前次上传时间。</p>

        <h2>启用软件许可证</h2>
          <p>显示软件许可证的前次上传时间，以及用于选择和上传或拖放新软件许可证文件的选项。

           通过在页面上放置新的软件许可证文件或选择上传，软件许可证会开始更新过程，这将花费一些时间。

           在更新结束之前，将持续报告进度。</p>

        <div class='actionsub'>上传</div>
            <p>上传软件许可证文件给BMC进行更新操作。</p>
