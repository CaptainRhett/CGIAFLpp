    <body>
        <div class='closeX'><a id="closeHelp" href='#' class='closeBtn'>关</a></div>

        <div class='helpmainhead'>自检代码 — 帮助</div>
        <p>使用此页面来查看最近开机自检结果。</p>
        <p>时间基准可能被认为是从系统自检开始。
        或者是前一段系统自检代码被记下来的时候。
        所有的时间格式被表示为分钟：秒：毫秒。</p>
        <p>显示的是上次启动和本次启动的系统自检代码。当系统复位或关闭时，本次启动代码
        就会变成上次启动的代码。</p>
        <p>光标停留超过一定时间，系统自检码，或者屏幕上的描述会突出所有其他有相同的系统自检码的发生的情况。点击停住一段时间，系统自检码或者屏幕上的描述将会突出显示直到另外一个代码被点击。</p>
    </body>
</html>
