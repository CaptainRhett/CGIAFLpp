# Check that mctp processes are running
#check process pcie_vdm_handler with pidfile /var/run/pcie_vdm_handler.pid
check process pcie_vdm_handler matching "/usr/bin/pcie_vdm_handler"
    start program = "/etc/monit/scripts/pcie_vdm_handler-init start"
    stop program = "/etc/monit/scripts/pcie_vdm_handler-init stop"
