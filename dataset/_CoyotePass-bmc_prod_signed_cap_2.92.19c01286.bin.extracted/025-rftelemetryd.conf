# Check that rftelemetryd process is running
check process rftelemetryd with pidfile /tmp/redfish/rftelemetryd.pid
    start program = "/etc/monit/scripts/rftelemetryd-init start" as uid "httpd" and gid "httpd"
    stop program = "/etc/monit/scripts/rftelemetryd-init stop"
###
# Check log file to ensure it does not grow too large.
check file rftelemetryd-log with path /var/log/rftelemetryd.log
    if not exist then unmonitor
    if size > 100 KB then exec "/usr/bin/rotate-log.sh -n 2 /var/log/rftelemetryd.log"
