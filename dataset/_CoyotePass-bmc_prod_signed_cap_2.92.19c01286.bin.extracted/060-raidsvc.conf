# Check that RAIDService process is running and listening on configured port
check process RAIDService with pidfile /var/run/raidsvc.pid
    start program = "/etc/monit/scripts/raidsvc-init start" with timeout 15 seconds
    stop program = "/etc/monit/scripts/raidsvc-init stop"
    if failed host ip6-localhost port 623 type UDP for 4 cycles
        then restart

###
# Check log file to ensure it does not grow too large.
check file raidsvc-log with path /var/log/raidsvc.log
    if not exist for 4 cycles then unmonitor
    if size > 100 KB then exec "/usr/bin/rotate-log.sh -n 2 /var/log/raidsvc.log"
